server {
    listen 80;
    listen [::]:80;
    server_name stat.physais.ru;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stat.physais.ru;

    root /var/www/physais-grade-dashboard/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/stat.physais.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stat.physais.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
